[project]
name = "kg-agent-platform-v1"
version = "0.1.0"
description = "面向知识图谱构建的多 Agent 协作平台 V1"
readme = "PROJECT.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langgraph>=1.0,<2.0",
    "minio>=7.2,<8.0",
    "openai>=1.0,<3.0",
    "pydantic>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_agent"]

[dependency-groups]
dev = [
    # 0.22.x 在线程连接与 SQLAlchemy/pytest 组合下存在永久挂起回归；测试环境固定
    # 使用 0.21 系列，生产环境仍使用 PostgreSQL/asyncpg。
    "aiosqlite>=0.21,<0.22",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
    "types-pyyaml>=6.0,<7.0",
]

[tool.pytest.ini_options]
addopts = "-q -s"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kg_agent"]
mypy_path = "src"
